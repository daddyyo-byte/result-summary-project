<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <section class="container">
    <div class="left">
      <h1>
        Your Result
      </h1>
      <div class="circle-text">
        <h3>76</h3>
        <p>of 100</p>
      </div>

      <h2>Great</h2>
      <span> You scored higher than 65% of the people who have taken these tests.</span>
    </div>


    <div class="right">
      <h1>
         Summary
      </h1>
      <div class="reaction-wrappers color-1">
        <div class="reaction-tags text-1">
          <img src="assets/images/icon-reaction.svg" alt="reaction">
          <p>Reaction</p>
        </div>

        <p>80 <span>/ 100</span></p>
      </div>

      <div class="reaction-wrappers  color-2">
        <div class="reaction-tags text-2">
          <img src="assets/images/icon-memory.svg" alt="memory">
          <p>Memmory</p>
        </div>

        <p>92 <span>/ 100</span></p>
      </div>

      <div class="reaction-wrappers color-3">
        <div class="reaction-tags text-3">
          <img src="assets/images/icon-verbal.svg" alt="verbal">
          <p>Verbal</p>
        </div>

        <p>61 <span>/ 100</span></p>

      </div>
      <div class="reaction-wrappers color-4">
        <div class="reaction-tags text-4">
          <img src="assets/images/icon-visual.svg" alt="visual">
          <p>Verbal</p>
        </div>

        <p>73 <span>/ 100</span></p>
      </div>

      <button type="submit">Continue</button>
    </div>
  </section>
</body>
</html>
